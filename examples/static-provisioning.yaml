# Static provisioning: bind a PersistentVolume to a directory that already
# exists in the EtcFS filesystem (or that the node plugin should create on
# first use). volumeHandle is the directory name relative to the filesystem
# root — a single path component, no slashes.
#
# Use this for data that predates the cluster, or when the directory layout is
# owned by an operator rather than by Kubernetes.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: etcfs-datasets
spec:
  capacity:
    storage: 100Gi          # informational: EtcFS reports cluster-wide capacity
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""      # unset, so no provisioner claims it
  csi:
    driver: csi.etcfs.io
    volumeHandle: datasets
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: etcfs-datasets
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: etcfs-datasets
  resources:
    requests:
      storage: 100Gi
