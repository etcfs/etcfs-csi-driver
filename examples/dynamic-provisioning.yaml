# Dynamic provisioning: the controller creates a directory in the shared EtcFS
# filesystem for the claim, and two pods on different nodes write into it at
# the same time.
#
# The requested size becomes a soft quota on that directory (reported by
# `etcfsctl quota`), not a hard ceiling — EtcFS enforces quotas by a sweep
# rather than inside the write path.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: etcfs-shared
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: etcfs
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: etcfs-writer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: etcfs-writer
  template:
    metadata:
      labels:
        app: etcfs-writer
    spec:
      # Spread the replicas so the two writers land on different nodes: one
      # pod per node is what actually exercises the shared-write path.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: etcfs-writer
              topologyKey: kubernetes.io/hostname
      containers:
        - name: writer
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              while true; do
                date -Iseconds >> /data/$(hostname).log
                echo "--- files visible from $(hostname) ---"
                ls -l /data
                sleep 5
              done
          volumeMounts:
            - name: shared
              mountPath: /data
      volumes:
        - name: shared
          persistentVolumeClaim:
            claimName: etcfs-shared
