version: 2

# Monthly, and grouped per ecosystem, so an idle month costs at most three pull
# requests. Minor and patch updates merge themselves through the merge queue once
# the required check passes; major ones wait for review
# (workflows/dependabot-automerge.yml).
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # One pull request for every action: the CodeQL init and analyze steps must
  # move together, and separate pull requests for them fail CodeQL until the
  # last one lands.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    groups:
      images:
        patterns: ["*"]
