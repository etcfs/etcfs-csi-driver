apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "etcfs-csi.fullname" . }}-node
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "etcfs-csi.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "etcfs-csi.name" . }}
      app.kubernetes.io/component: node
  template:
    metadata:
      labels:
        {{- include "etcfs-csi.labels" . | nindent 8 }}
        app.kubernetes.io/component: node
    spec:
      serviceAccountName: {{ include "etcfs-csi.fullname" . }}-node
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- with .Values.node.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.node.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: node-driver-registrar
          image: {{ .Values.node.registrarImage }}
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path={{ .Values.kubeletDir }}/plugins/{{ .Values.driverName }}/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
        - name: etcfs-csi
          image: {{ include "etcfs-csi.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --mode=node
            - --driver-name={{ .Values.driverName }}
            - --endpoint=unix:///csi/csi.sock
            - --mount-path={{ .Values.mountPath }}
            # Must match the EtcFS daemon's --node-id on this host, which is
            # its hostname; the fence path is keyed by that identifier.
            - --node-id=$(NODE_NAME)
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            # Bidirectional: the bind mounts this container makes under the
            # kubelet directory have to propagate back to the host, or the
            # kubelet never sees the pod's volume.
            - name: kubelet-dir
              mountPath: {{ .Values.kubeletDir }}
              mountPropagation: Bidirectional
            - name: etcfs-mount
              mountPath: {{ .Values.mountPath }}
              mountPropagation: HostToContainer
          resources:
            {{- toYaml .Values.node.resources | nindent 12 }}
      volumes:
        - name: socket-dir
          hostPath:
            path: {{ .Values.kubeletDir }}/plugins/{{ .Values.driverName }}
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: {{ .Values.kubeletDir }}/plugins_registry
            type: Directory
        - name: kubelet-dir
          hostPath:
            path: {{ .Values.kubeletDir }}
            type: Directory
        - name: etcfs-mount
          hostPath:
            path: {{ .Values.mountPath }}
            type: Directory
