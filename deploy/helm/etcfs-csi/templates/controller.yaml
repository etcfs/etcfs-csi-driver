apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "etcfs-csi.fullname" . }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "etcfs-csi.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controller.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "etcfs-csi.name" . }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        {{- include "etcfs-csi.labels" . | nindent 8 }}
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: {{ include "etcfs-csi.fullname" . }}-controller
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: csi-provisioner
          image: {{ .Values.controller.provisionerImage }}
          args:
            - --csi-address=/csi/csi.sock
            - --timeout=60s
            - --leader-election=false
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        - name: csi-attacher
          image: {{ .Values.controller.attacherImage }}
          args:
            - --csi-address=/csi/csi.sock
            - --timeout=60s
            - --leader-election=false
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        - name: etcfs-csi
          image: {{ include "etcfs-csi.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --mode=controller
            - --driver-name={{ .Values.driverName }}
            - --endpoint=unix:///csi/csi.sock
            - --mount-path={{ .Values.mountPath }}
            - --node-id=$(NODE_NAME)
            {{- include "etcfs-csi.etcdArgs" . | nindent 12 }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            # The controller provisions by creating a directory in the shared
            # filesystem, so it needs the host's EtcFS mount. HostToContainer
            # propagation is what makes the daemon's mount visible here at all.
            - name: etcfs-mount
              mountPath: {{ .Values.mountPath }}
              mountPropagation: HostToContainer
            {{- if .Values.etcd.tlsSecretName }}
            - name: etcd-tls
              mountPath: /etc/etcfs/etcd-tls
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
      volumes:
        - name: socket-dir
          emptyDir: {}
        - name: etcfs-mount
          hostPath:
            path: {{ .Values.mountPath }}
            type: Directory
        {{- if .Values.etcd.tlsSecretName }}
        - name: etcd-tls
          secret:
            secretName: {{ .Values.etcd.tlsSecretName }}
        {{- end }}
