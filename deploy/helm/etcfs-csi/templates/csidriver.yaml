apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: {{ .Values.driverName }}
  labels:
    {{- include "etcfs-csi.labels" . | nindent 4 }}
spec:
  # attachRequired drives ControllerPublishVolume/ControllerUnpublishVolume,
  # and the unpublish call is where a departed node's fence intent is recorded.
  # Turning it off would remove the driver's only view of a node losing a
  # volume.
  attachRequired: true
  podInfoOnMount: false
  fsGroupPolicy: File
  volumeLifecycleModes:
    - Persistent
