{{- if .Values.storageClass.create }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.storageClass.name }}
  labels:
    {{- include "etcfs-csi.labels" . | nindent 4 }}
  {{- if .Values.storageClass.isDefault }}
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
  {{- end }}
provisioner: {{ .Values.driverName }}
reclaimPolicy: {{ .Values.storageClass.reclaimPolicy }}
# The filesystem is one shared namespace that already exists; there is nothing
# to defer until a pod is scheduled.
volumeBindingMode: Immediate
allowVolumeExpansion: false
{{- with .Values.storageClass.parameters }}
parameters:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
